name: Python checks
on:
  push:
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax
        run: python -m compileall -q kk_robot.py core.py tests
      - name: Unit tests
        run: PYTHONPATH=. python -m unittest discover -s tests -v
